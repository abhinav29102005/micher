[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micher"
version = "1.0.0"
description = "Multi-link network bonding — combine Ethernet + WiFi + Hotspot for maximum transfer speed"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "micher contributors"}]
keywords = ["network", "bonding", "multi-link", "transfer", "speed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

dependencies = [
    "rich>=13.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2",
    "pystray>=0.19",
    "Pillow>=10.0",
]
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.0",
]

[project.scripts]
micher = "micher.cli:main"

[project.gui-scripts]
micher-gui = "micher.gui.app:main"

[tool.setuptools.packages.find]
include = ["micher*"]

[tool.setuptools.package-data]
micher = ["assets/*"]
